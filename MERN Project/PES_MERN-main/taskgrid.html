<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
     .container
     {
        display: grid;
        grid-template-rows:100px 100px 100px 100px;
        grid-template-columns: 100px 100px 100px 100px 100px 100px;
        gap:20px;
        
        

     }
     .a 
     {
        border:2pX solid black;
        background-color: greenyellow;
        text-align: center;
     }
     .b{
        
        grid-column: 1/6;
        
     }
     .s
     {
        grid-row:2/4;

     }
     .c1
     {
        grid-row:2/2;
        grid-column: 2/6;
     }
     .c2
     {
        grid-row:3/3;
        grid-column: 2/4;
     }
     .c3
     {
        grid-row:3/3;
        grid-column: 4/6;

     }
     
    </style>
</head>
<body>
    <div class="container">
        <div class="a b">Header</div>
        <div class="a s">SideBar</div>
        <div class="a c1">content1</div>
        <div class="a c2">content2</div>
        <div class="a c3">content3</div>
        <div class="a b">Footer</div>
    </div>
</body>
</html>
