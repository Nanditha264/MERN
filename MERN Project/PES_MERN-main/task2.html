<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.box
{
 color:azure;
    
}

.navbar
{
    display:flex;
    flex-direction: row;
    justify-content: space-around;
    background-color: blue;
    color: aliceblue;
    border-radius: 40px;
}
.container
{
    display: flex;
    justify-content: space-evenly;
    width:500px;
}
li{
    list-style: none;
}
li:hover{
    color: rgb(160, 95, 149);
    text-decoration: underline;

}
@media screen and (max-width: 600px) {

    .navbar {
        flex-direction: column;
        align-items: center;
        border-radius: 20px;
    }

    .container {
        width: 100%;
        padding: 0;
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }
}

</style>
</head>
<body>
 <div class="navbar">
    <h3>Mysite</h3>  
 <ul class="container box">
  <li>Home</li>
  <li>About</li>
  <li>service</li>
  <li>contact</li>
  </ul>
  </div> 
</body>
</body>

</html>
